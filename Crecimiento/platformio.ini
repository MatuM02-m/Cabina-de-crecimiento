; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
;  FIRMWARE PRINCIPAL — Cabina de crecimiento completa
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9
	me-no-dev/ESPAsyncWebServer @ ^3.6.0
	bblanchon/ArduinoJson @ ^7.4.1
	knolleary/PubSubClient @ ^2.8
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0

; ============================================================
;  ENVIRONMENT DE PRUEBA — Solo herramientas mínimas
;  Usar con: pio run -e test / pio run -e test -t upload
; ============================================================
[env:test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Sin lib_deps — solo framework Arduino (suficiente para LEDC/GPIO)